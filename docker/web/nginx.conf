# Replaces nginx:alpine's default /etc/nginx/conf.d/default.conf.
# Static site serving (unchanged from the base image's default) plus two
# reverse-proxy locations to the bundled proxy service, so a self-hosted
# elab2arc has no dependency on the maintainer's wb-e.com infrastructure.
# See ../TODOs.md.

server {
    listen 80;
    server_name _;

    # The real wb-e.com proxy configs set this too, for the same reason: the
    # embedded target URL after /_corsproxy/ contains a literal "://" - without
    # this, nginx collapses that double-slash by default, corrupting the URL
    # before the proxy ever sees it. Confirmed necessary via a real request
    # that 400'd until this was added, not copied blindly from the reference
    # configs.
    merge_slashes off;

    # Match the real wb-e.com proxy configs' client_max_body_size, so large
    # LFS uploads aren't rejected by nginx before they even reach the proxy.
    client_max_body_size 1000M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # Generic CORS+LFS API proxy - matches the client's fetchWithProxyFallback()/
    # LFS upload convention of embedding the full, already-schemed target URL
    # directly after this path (e.g. /_corsproxy/https://elab.dataplan.top/api/v2/users).
    # The trailing slash on both the location and proxy_pass URI is what makes
    # nginx strip the /_corsproxy/ prefix before forwarding - required here
    # (not optional): the backend's generic_proxy.py expects the target URL at
    # its own path root. Confirmed necessary the hard way - an earlier design
    # tried stripping this prefix inside aiohttp instead (sub-app mounting) and
    # it silently doesn't rewrite request.path, only route match_info.
    location /_corsproxy/ {
        proxy_pass http://proxy:9998/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Git protocol proxy for isomorphic-git clone/fetch/push - isomorphic-git's
    # own corsProxy convention (bare domain, no scheme) is exactly what the
    # vendored cors-proxy-py dependency (unmodified) expects once nginx has
    # stripped the /_gitproxy/ prefix, same reasoning as above.
    location /_gitproxy/ {
        proxy_pass http://proxy:9999/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
