<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>elab2arc intro</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #161616;
    --stone: #4f4d49;
    --cloud: #9a9892;
    --border: #e4e1d9;
    --elab: #2f8fc0;
    --elab-wash: #e1f0fb;
    --arc: #0b6266;
    --arc-wash: #d9edee;
    --good: #2c8c46;
    --good-wash: #e1f2e5;
    --warn: #d97706;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  .wrap {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.6rem 0.75rem;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 900 / 470;
    cursor: pointer;
  }
  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .scene.active { opacity: 1; pointer-events: auto; }
  .scene svg { width: 100%; height: 100%; display: block; }

  .dots {
    display: flex; gap: 0.4rem;
    margin-top: 0.5rem;
  }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background 0.25s, transform 0.25s;
  }
  .dots span.on { background: var(--arc); transform: scale(1.25); }

  text { user-select: none; }

  @media (prefers-reduced-motion: reduce) {
    svg * { animation: none !important; }
  }

  /* ---------- Scene 1 : Title ---------- */
  .s1-mark { transform-box: fill-box; transform-origin: center; }
  .scene1.active .s1-mark { animation: s1in 0.8s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes s1in { 0%{opacity:0; transform:translateY(14px) scale(0.92);} 100%{opacity:1; transform:translateY(0) scale(1);} }
  .s1-word { opacity: 0; }
  .scene1.active .s1-word { animation: s1fade 0.7s ease 0.35s both; }
  .s1-tag { opacity: 0; }
  .scene1.active .s1-tag { animation: s1fade 0.7s ease 0.65s both; }
  .s1-sub { opacity: 0; }
  .scene1.active .s1-sub { animation: s1fade 0.7s ease 0.95s both; }
  @keyframes s1fade { 0%{opacity:0; transform:translateY(8px);} 100%{opacity:1; transform:translateY(0);} }
  .s1-gear { transform-box: fill-box; transform-origin: center; }
  .scene1.active .s1-gear { animation: s1spin 6s linear infinite; }
  .scene1.active .s1-gear2 { animation: s1spin 6s linear infinite reverse; }
  @keyframes s1spin { to { transform: rotate(360deg); } }

  /* ---------- Scene 2 : Problem ---------- */
  .s2fig { transform-box: fill-box; transform-origin: bottom center; }
  .scene2.active .s2fig { animation: s2bob 3s ease-in-out infinite; }
  @keyframes s2bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .s2bub { transform-box: fill-box; transform-origin: bottom left; opacity: 0; }
  .scene2.active .s2bub { animation: s2pop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both; }
  .scene2.active .s2bub2 { animation: s2pop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.85s both; }
  @keyframes s2pop { 0%{transform:scale(0.85); opacity:0} 100%{transform:scale(1); opacity:1} }
  .s2note { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .scene2.active .s2note { animation: s2notein 0.6s ease 1.3s both; }
  @keyframes s2notein { 0%{opacity:0; transform:scale(0.7) rotate(-8deg);} 100%{opacity:1; transform:scale(1) rotate(-5deg);} }

  /* ---------- Scene 3 : Purifier ---------- */
  .pm-gear { transform-box: fill-box; transform-origin: center; }
  .scene3.active .pm-gear { animation: pmspin 4.5s linear infinite; }
  .scene3.active .pm-gear2 { animation: pmspin 4.5s linear infinite reverse; }
  @keyframes pmspin { to { transform: rotate(360deg); } }
  .pm-bub { opacity: 0; }
  .scene3.active .pm-bub { animation: pmrise 1.4s ease-in 0.4s infinite; }
  .scene3.active .pm-bub.b2 { animation-delay: 0.9s; }
  .scene3.active .pm-bub.b3 { animation-delay: 1.3s; }
  @keyframes pmrise { 0%{opacity:0; transform:translateY(0)} 20%{opacity:0.9} 100%{opacity:0; transform:translateY(-70px)} }
  .pm-in { transform-box: fill-box; transform-origin: center; opacity: 1; }
  .scene3.active .pm-in { animation: pmfeed 1s ease-in 0.6s both; }
  @keyframes pmfeed { 0%{transform:translate(0,0) scale(1); opacity:1;} 70%{opacity:1;} 100%{transform:translate(230px,-10px) scale(0.25); opacity:0;} }
  .pm-out { transform-box: fill-box; transform-origin: center; opacity: 0.14; }
  .scene3.active .pm-out { animation: pmout 0.7s ease-out 1.5s both; }
  @keyframes pmout { from{opacity:0.14; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }
  .pm-spark { opacity: 0; }
  .scene3.active .pm-spark { animation: pmspark 0.9s ease-out 1.7s 2; }
  @keyframes pmspark { 0%{opacity:0; transform:scale(0.4)} 40%{opacity:1} 100%{opacity:0; transform:scale(1.4)} }
  .s3fig { transform-box: fill-box; transform-origin: bottom center; }
  .scene3.active .s3fig { animation: s2bob 3.4s ease-in-out infinite; }
  .s3-caption { opacity: 0; }
  .scene3.active .s3-caption { animation: s1fade 0.7s ease 1.9s both; }

  /* ---------- Scene 4 : Handoff ---------- */
  .s4-nav { transform-box: fill-box; transform-origin: top center; opacity: 0; }
  .scene4.active .s4-nav { animation: s4slide 0.6s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes s4slide { 0%{opacity:0; transform:translateY(-10px)} 100%{opacity:1; transform:translateY(0)} }
  .s4-msg { opacity: 0; }
  .scene4.active .s4-msg { animation: s1fade 0.7s ease 0.5s both; }
  .s4-arrow { transform-box: fill-box; transform-origin: center; }
  .scene4.active .s4-arrow { animation: s4bounce 1.1s ease-in-out 1.1s infinite; }
  @keyframes s4bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
  .s4-glow { opacity: 0; }
  .scene4.active .s4-glow { animation: s1fade 0.9s ease 0.9s both; }
</style>
</head>

<script>
(function () {
  var scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
  var dots = Array.prototype.slice.call(document.querySelectorAll('#dots span'));
  var idx = 0;
  var timer = null;
  var paused = false;

  function show(i) {
    idx = (i + scenes.length) % scenes.length;
    scenes.forEach(function (s, n) { s.classList.toggle('active', n === idx); });
    dots.forEach(function (d, n) { d.classList.toggle('on', n === idx); });
  }

  function schedule() {
    clearTimeout(timer);
    if (paused) return;
    var dur = parseInt(scenes[idx].getAttribute('data-dur'), 10) || 5000;
    timer = setTimeout(function () { show(idx + 1); schedule(); }, dur);
  }

  dots.forEach(function (d) {
    d.addEventListener('click', function () {
      show(parseInt(d.getAttribute('data-i'), 10));
      schedule();
    });
  });

  document.getElementById('stage').addEventListener('click', function () {
    show(idx + 1);
    schedule();
  });

  document.addEventListener('visibilitychange', function () {
    paused = document.hidden;
    if (!paused) schedule(); else clearTimeout(timer);
  });

  show(0);
  schedule();
})();
</script>
